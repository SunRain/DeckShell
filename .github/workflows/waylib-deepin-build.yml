name: Build waylib on Deepin crimson (independent)

on:
  push:
    paths:
      - '3rdparty/waylib-shared'
      - '.github/workflows/waylib-deepin-build.yml'

  pull_request:
    paths:
      - '3rdparty/waylib-shared'
      - '.github/workflows/waylib-deepin-build.yml'

jobs:
  container:
    runs-on: ubuntu-latest
    container: linuxdeepin/deepin:crimson
    env:
      WAYLIB_TREELAND_PROTOCOLS_DIR: ${{ github.workspace }}/protocols/compositor/xml
    steps:
      - uses: actions/checkout@v4
        # 远端运行前须另行配置可访问的 wlroots 子模块 URL。
        with:
          submodules: recursive

      - name: Install build dependencies
        working-directory: 3rdparty/waylib-shared/waylib
        run: |
          set -euxo pipefail
          echo "deb [trusted=yes] http://mirrors.kernel.org/deepin/beige/ crimson main commercial community" > /etc/apt/sources.list
          echo "deb-src [trusted=yes] http://mirrors.kernel.org/deepin/beige/ crimson main commercial community" >> /etc/apt/sources.list
          echo "deb [trusted=yes] https://ci.deepin.com/repo/deepin/deepin-community/stable/ crimson main commercial community" >> /etc/apt/sources.list
          echo "deb-src [trusted=yes] https://ci.deepin.com/repo/deepin/deepin-community/stable/ crimson main commercial community" >> /etc/apt/sources.list
          echo "deb [trusted=yes] https://ci.deepin.com/repo/deepin/deepin-community/testing/ unstable/crimson main commercial community" >> /etc/apt/sources.list
          echo "deb-src [trusted=yes] https://ci.deepin.com/repo/deepin/deepin-community/testing/ unstable/crimson main commercial community" >> /etc/apt/sources.list
          rm -rf /etc/apt/sources.list.d

          apt-get update
          apt-get install -y devscripts equivs

          # Install wlr-protocols package directly (ignore auth for this one operation)
          apt-get install -y --allow-unauthenticated wlr-protocols || true

          mk-build-deps --install --remove --tool='apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends --yes' debian/control

      - name: Build waylib deb package
        working-directory: 3rdparty/waylib-shared/waylib
        run: |
          set -euxo pipefail
          dpkg-buildpackage -uc -us -b
          echo "✅ waylib deb package built successfully!"
          ls -la ../*.deb

      - name: Upload waylib deb packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waylib-deepin-deb-packages
          path: "3rdparty/waylib-shared/*.deb"
          if-no-files-found: error
          retention-days: 30
